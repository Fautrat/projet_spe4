services:
  spe4_mysql:
    image: mysql:8.4
    container_name: spe4_mysql
    restart: unless-stopped
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - spe4_mysql:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    networks:
      - spe4

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: phpmyadmin
    restart: unless-stopped
    depends_on:
      spe4_mysql:
        condition: service_healthy
    environment:
      PMA_PORT: ${DB_PORT:-3306}
      PMA_HOST: spe4_mysql
      PMA_USER: ${DB_USER}
      PMA_PASSWORD: ${DB_PASSWORD}
    ports:
      - 8080:80
    networks:
      - spe4

volumes:
  spe4_mysql:
    name: spe4_mysql

networks:
  spe4:
    name: spe4
    driver: bridge